tags:
  - Contacts
summary: Update a contact
operationId: updateContact
description: Update a contact
security:
  - bearerAuth: []
parameters:
  - name: id
    in: path
    required: true
    description: ID of the contact to update
    schema:
      type: string
requestBody:
  required: true
  content:
    multipart/form-data:
      schema:
        type: object
        properties:
          name:
            type: string
            description: Updated name of the contact
            example: Ivan Petrenko
          phoneNumber:
            type: string
            description: Updated contact number
            example: 380931234567
          email:
            type: string
            format: email
            description: Updated email
            example: ivan@example.com
          photo:
            type: string
            format: binary
            description: New contact photo
responses:
  '200':
    description: Successfully updated contact
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
            - data
          properties:
            status:
              type: integer
              example: 200
            message:
              type: string
              example: Contact updated successfully
            data:
              $ref: ../../../components/schemas/contact.yaml
  '401':
    $ref: ../../../components/responses/401.yaml
  '500':
    $ref: ../../../components/responses/500.yaml
