tags:
  - Contacts
summary: Get all contacts
operationId: getAllContacts
description: All user contacts
security:
  - bearerAuth: []
parameters:
  - name: page
    in: query
    required: false
    schema:
      type: integer
      minimum: 1
      default: 1
      example: 1
    description: Page number for pagination
  - name: perPage
    in: query
    required: false
    schema:
      type: integer
      minimum: 1
      default: 10
      example: 10
    description: Number of contacts per page
  - name: sortBy
    in: query
    required: false
    schema:
      type: string
      enum: [name, email, phoneNumber]
    description: Field to sort
  - name: sortOrder
    in: query
    required: false
    schema:
      type: string
      enum: [asc, desc]
    description: Sort order
responses:
  '200':
    description: Successfully found contacts!
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - data
          properties:
            status:
              type: integer
              example: 200
            data:
              type: object
              required:
                - page
                - perPage
                - totalItems
                - totalPages
                - data
              properties:
                data:
                  type: array
                  items:
                    $ref: ../../components/schemas/contact.yaml
                page:
                  type: integer
                  example: 1
                perPage:
                  type: integer
                  example: 5
                totalIems:
                  type: integer
                  example: 4
                totalPages:
                  type: integer
                  example: 1
                hasNextPage:
                  type: boolean
                  example: false
                HasPreviousPage:
                  type: boolean
                  example: false
  '401':
    $ref: ../../components/responses/401.yaml
  '500':
    $ref: ../../components/responses/500.yaml
