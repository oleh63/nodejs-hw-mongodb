tags:
  - Contacts
summary: Get all contacts
operationId: getAllContacts
description: All user contacts
security:
  - bearerAuth: []
parameters:
  - in: query
    name: page
    schema:
      type: integer
      example: 1
    description: Page number for pagination
  - in: query
    name: limit
    schema:
      type: integer
      example: 20
    description: Number of contacts per page
  - in: query
    name: favorite
    schema:
      type: boolean
      example: true
    description: Filter contacts by favorite status
responses:
  '200':
    description: List of contacts
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
            - data
          properties:
            status:
              type: integer
              example: 200
            message:
              type: string
              example: Successfully found contacts!
            data:
              $ref: ../../components/schemas/contact.yaml
  '401':
    $ref: ../../components/responses/401.yaml
  '500':
    $ref: ../../components/responses/500.yaml
