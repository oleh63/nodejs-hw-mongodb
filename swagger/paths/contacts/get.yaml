tags:
  - Contacts
summary: Get all contacts
operationId: getAllContacts
description: All user contacts
security:
  - bearerAuth: []
parameters:
  - name: page
    in: query
    required: false
    schema:
      type: integer
      minimum: 1
      default: 1
      example: 1
    description: Page number for pagination
  - name: perPage
    in: query
    required: false
    schema:
      type: integer
      minimum: 1
      default: 10
      example: 10
    description: Number of contacts per page
  - name: sortBy
    in: query
    required: false
    schema:
      type: string
      enum: [name, email, phoneNumber]
    description: Field to sort
  - name: sortOrder
    in: query
    required: false
    schema:
      type: string
      enum: [asc, desc]
    description: Sort order
  - name: name
    in: query
    required: false
    schema:
      type: string
    description: Filter contacts by name
  - name: email
    in: query
    required: false
    schema:
      type: string
    description: Filter contacts by email
responses:
  '200':
    description: Successfully found contacts!
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - data
          properties:
            status:
              type: integer
              example: 200
            data:
              type: object
              required:
                - totalPages
                - currentPage
                - perPage
                - totalCount
                - contacts
              properties:
                totalPages:
                  type: integer
                  example: 5
                currentPage:
                  type: integer
                  example: 1
                perPage:
                  type: integer
                  example: 10
                totalCount:
                  type: integer
                  example: 50
                contacts:
                  type: array
                  items:
                    $ref: ../../components/schemas/contact.yaml
  '401':
    $ref: ../../components/responses/401.yaml
  '500':
    $ref: ../../components/responses/500.yaml
